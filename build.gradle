import java.time.Duration
import java.util.Locale

plugins {
	id 'java'
	id 'eclipse'
	id 'maven-publish'
	id 'signing'
	id 'org.cadixdev.licenser' version '0.6.1'
}

group = "blue.endless";
version = "2.0.0";
def versionSuffix = '-alpha.3'

if (project.hasProperty("versionSuffix")) {
	versionSuffix = '-'+project.versionSuffix;
}
if (project.hasProperty("buildNumber")) {
	versionSuffix += '-'+project.buildNumber;
}

version += versionSuffix;

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 21
}

base {
	archivesName = "Jankson";
}

repositories {
	mavenCentral();
}

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar();
	withJavadocJar();
}

tasks.withType(Jar).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			"Automatic-Module-Name" : "jankson"
		);
	}
}

tasks.withType(Javadoc).configureEach {
	failOnError false
	//options.addBooleanOption("Xdoclint:none", true)
	options.addStringOption("Xdoclint:none", "-quiet")
	options.addStringOption("Xmaxwarns", "1")
}

publishing {
	publications {
		mavenPrimary(MavenPublication) {
			from components.java;
			

			groupId project.group;
			artifactId "jankson";
			version project.version;
			
			pom {
				name = "Jankson";
				description = "JSON5 / HJSON parser and preprocessor which preserves ordering and comments";
				url = "https://github.com/falkreon/Jankson";
				
				developers {
					developer {
						id = "falkreon"
						name = "Isaac Ellingson"
						email = "falkreon@gmail.com"
					}
				}
				
				licenses {
					license {
						name = "MIT License"
						url = "https://opensource.org/licenses/MIT"
						distribution = "repo"
					}
				}
				
				scm {
					url = "https://github.com/falkreon/Jankson"
					connection = "scm:git:git@github.com:falkreon/Jankson.git"
					developerConnection = "scm:git:git@github.com:falkreon/Jankson.git"
				}
			}
		}
	}
	
	repositories {
		maven {
			name = 'artifactSmoke'
			url = layout.buildDirectory.dir('artifact-smoke/repository')
		}
		if (project.hasProperty("ossrhUsername")) {
			maven {
				def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
				def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots/"
				url = releasesRepoUrl; //version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
				
				credentials {
					username = ossrhUsername
					password = ossrhPassword
				}
				
			}
		}
		
		if (project.hasProperty("sleepingUsername")) {
			maven {
				url "https://repo-api.sleeping.town/"
				
				credentials {
					username = sleepingUsername
					password = sleepingPassword
				}
			}
		}
	}
}

if (file("private.gradle").exists()) {
	apply from: "private.gradle";
}

defaultTasks "clean", "build";

// Deliberately depend on one named local publication, never publish/publishToMavenLocal.
def cleanArtifactSmokeRepository = tasks.register('cleanArtifactSmokeRepository', Delete) {
	delete layout.buildDirectory.dir('artifact-smoke/repository')
}
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
	if (name == 'publishMavenPrimaryPublicationToArtifactSmokeRepository') {
		dependsOn cleanArtifactSmokeRepository
	}
}
def prepareArtifactSmokeConsumer = tasks.register('prepareArtifactSmokeConsumer', Sync) {
	from 'integration-tests/consumer'
	into layout.buildDirectory.dir('artifact-smoke/consumer')
}
tasks.register('artifactSmokeTest', Exec) {
	group = 'verification'
	description = 'Publish locally and verify an independent Maven consumer on classpath and module path.'
	dependsOn 'publishMavenPrimaryPublicationToArtifactSmokeRepository', prepareArtifactSmokeConsumer
	timeout = Duration.ofMinutes(5)
	workingDir rootDir
	def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
	def wrapperCommand = windows ? ['cmd', '/d', '/c', file('gradlew.bat').absolutePath] : [file('gradlew').absolutePath]
	commandLine wrapperCommand + ['--no-daemon', '--max-workers=1', '--offline',
			'--project-dir', layout.buildDirectory.dir('artifact-smoke/consumer').get().asFile.absolutePath,
			"-PartifactRepository=${layout.buildDirectory.dir('artifact-smoke/repository').get().asFile.absolutePath}",
			"-PjanksonVersion=${project.version}", 'clean', 'smoke', 'moduleSmoke']
}


dependencies {
	testImplementation(platform('org.junit:junit-bom:5.9.2'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2";
	testImplementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2";
}

test {
	useJUnitPlatform()
}

signing {
	if (project.hasProperty("signing.keyId")) {
		println("Key credentials found. Enabling jar signing.");
		sign configurations.archives;
		sign publishing.publications.mavenPrimary
		
		
		// Use the big hammer to establish dependencies that should already be there
		tasks.named("publish").configure { dependsOn("signArchives") }
		tasks.named("publishAllPublicationsToMavenRepository").configure { dependsOn("signArchives") }
		tasks.named("publishMavenPrimaryPublicationToMavenLocal").configure { dependsOn("signArchives") }
		tasks.named("publishMavenPrimaryPublicationToMavenRepository").configure { dependsOn("signArchives") }
		tasks.named("publishToMavenLocal").configure { dependsOn("signArchives") }
	} else {
		println("Skipping jar signing");
	}
}
